    <text transform="rotate(226.5) translate(0, -101) rotate(180)" text-anchor="middle">i</text>
    <text transform="rotate(218.1) translate(0, -101) rotate(180)" text-anchor="middle">t</text>
    <text transform="rotate(209.6) translate(0, -101) rotate(180)" text-anchor="middle">a</text>
    <text transform="rotate(201.2) translate(0, -101) rotate(180)" text-anchor="middle">e</text>
    <text transform="rotate(184.2) translate(0, -101) rotate(180)" text-anchor="middle">d</text>
    <text transform="rotate(175.8) translate(0, -101) rotate(180)" text-anchor="middle">i</text>
    <text transform="rotate(167.3) translate(0, -101) rotate(180)" text-anchor="middle">s</text>
    <text transform="rotate(158.8) translate(0, -101) rotate(180)" text-anchor="middle">c</text>
    <text transform="rotate(150.4) translate(0, -101) rotate(180)" text-anchor="middle">i</text>
