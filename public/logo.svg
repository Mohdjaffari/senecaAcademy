    <text transform="rotate(-11.6) translate(0, -101)" text-anchor="middle">h</text>
    <text transform="rotate(-3.9) translate(0, -101)" text-anchor="middle">o</text>
    <text transform="rotate(3.9) translate(0, -101)" text-anchor="middle">l</text>
    <text transform="rotate(11.6) translate(0, -101)" text-anchor="middle">a</text>
    <text transform="rotate(19.3) translate(0, -101)" text-anchor="middle">e</text>
    <text transform="rotate(27.1) translate(0, -101)" text-anchor="middle">,</text>
    <text transform="rotate(42.5) translate(0, -101)" text-anchor="middle">s</text>
    <text transform="rotate(50.3) translate(0, -101)" text-anchor="middle">e</text>
    <text transform="rotate(58.0) translate(0, -101)" text-anchor="middle">d</text>
      
